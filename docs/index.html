<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GiftLink — Give items a second life</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f7f3;color:#202820}
nav{display:flex;justify-content:space-between;align-items:center;padding:28px 8%;font-weight:bold}
.logo{font-size:25px;color:#246b50}
nav a{color:#202820;text-decoration:none}
.hero{min-height:75vh;display:flex;align-items:center;padding:60px 10%;gap:40px}
.copy{max-width:650px}
.tag{color:#246b50;font-weight:bold;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(42px,6vw,72px);line-height:1.05;margin:20px 0}
p{font-size:19px;line-height:1.7;color:#62685f}
.cta{display:inline-block;background:#246b50;color:white;text-decoration:none;padding:16px 28px;border-radius:8px;margin-top:18px;font-weight:bold}
.art{font-size:120px;background:#e2eadf;border-radius:40% 60% 50% 45%;padding:65px}
footer{text-align:center;padding:24px;color:#777}
@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.art{font-size:70px;padding:35px}}
</style>
</head>
<body>
<nav><div class="logo">GiftLink</div><a href="#about">About us</a></nav>
<main class="hero" id="about">
<section class="copy">
<div class="tag">Share more. Waste less.</div>
<h1>Give good things a second life.</h1>
<p>GiftLink connects people who have useful items to give away with people who need them. Discover available gifts, search by category, and make reuse easier.</p>
<a class="cta" href="./index.html">Get Started →</a>
</section>
<div class="art" aria-hidden="true">🎁</div>
</main>
<footer>GiftLink · A community built on sharing</footer>
</body>
</html>
